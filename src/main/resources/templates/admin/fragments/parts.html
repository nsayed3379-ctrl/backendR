<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<!-- ============================================================= -->
<th:block th:fragment="head-assets">
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <link rel="preconnect" href="https://cdn.jsdelivr.net"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" th:href="@{/admin/css/admin.css}"/>
</th:block>

<!-- ============================================================= -->
<!-- Leaflet + OpenStreetMap — click-to-pin location picker for the business form (no API key needed). -->
<th:block th:fragment="map-assets">
    <link href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css" rel="stylesheet"/>
    <script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
</th:block>

<!-- ============================================================= -->
<div th:fragment="topbar" class="admin-topbar">
    <div class="admin-topbar-brand">
        <i class="bi bi-shield-check"></i>
        <span>BD Review <strong>Admin</strong></span>
    </div>
    <div class="admin-topbar-user" th:if="${currentAdmin != null}">
        <div class="admin-topbar-user-info">
            <span class="admin-topbar-user-name" th:text="${currentAdmin.name != null ? currentAdmin.name : currentAdmin.phoneNumber}">Admin</span>
            <span class="admin-topbar-user-phone" th:text="${currentAdmin.phoneNumber}">+8801700000000</span>
        </div>
        <form th:action="@{/admin/logout}" method="post" class="admin-logout-form">
            <button type="submit" class="btn btn-sm btn-outline-light">
                <i class="bi bi-box-arrow-right"></i> Sign out
            </button>
        </form>
    </div>
</div>

<!-- ============================================================= -->
<nav th:fragment="sidebar(active)" class="admin-sidebar">
    <ul class="admin-nav">
        <li>
            <a th:href="@{/admin/dashboard}" th:classappend="${active == 'dashboard'} ? 'active'">
                <i class="bi bi-speedometer2"></i> Dashboard
            </a>
        </li>
        <li class="admin-nav-section">Catalog</li>
        <li>
            <a th:href="@{/admin/businesses}" th:classappend="${active == 'businesses'} ? 'active'">
                <i class="bi bi-shop"></i> Businesses
            </a>
        </li>
        <li>
            <a th:href="@{/admin/reference-data}" th:classappend="${active == 'reference-data'} ? 'active'">
                <i class="bi bi-tags"></i> Categories &amp; Areas
            </a>
        </li>
        <li class="admin-nav-section">People</li>
        <li>
            <a th:href="@{/admin/users}" th:classappend="${active == 'users'} ? 'active'">
                <i class="bi bi-people"></i> Users
            </a>
        </li>
        <li class="admin-nav-section">Moderation</li>
        <li>
            <a th:href="@{/admin/reviews}" th:classappend="${active == 'reviews'} ? 'active'">
                <i class="bi bi-star"></i> Reviews
            </a>
        </li>
        <li>
            <a th:href="@{/admin/reports}" th:classappend="${active == 'reports'} ? 'active'">
                <i class="bi bi-flag"></i> Reports
            </a>
        </li>
        <li>
            <a th:href="@{/admin/claims}" th:classappend="${active == 'claims'} ? 'active'">
                <i class="bi bi-patch-check"></i> Business Claims
            </a>
        </li>
        <li class="admin-nav-section">System</li>
        <li>
            <a th:href="@{/admin/audit-log}" th:classappend="${active == 'audit'} ? 'active'">
                <i class="bi bi-clock-history"></i> Audit Log
            </a>
        </li>
    </ul>
</nav>

<!-- ============================================================= -->
<div th:fragment="alerts" class="admin-alerts">
    <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="alert">
        <i class="bi bi-check-circle"></i> <span th:text="${successMessage}">Success</span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <i class="bi bi-exclamation-triangle"></i> <span th:text="${errorMessage}">Error</span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div th:if="${infoMessage}" class="alert alert-info alert-dismissible fade show" role="alert">
        <i class="bi bi-info-circle"></i> <span th:text="${infoMessage}">Info</span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
</div>

<!-- ============================================================= -->
<th:block th:fragment="scripts">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</th:block>

</body>
</html>
