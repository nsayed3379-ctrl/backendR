<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Businesses - BD Review Admin</title>
    <th:block th:replace="~{admin/fragments/parts :: head-assets}"></th:block>
</head>
<body class="admin-body">
<div th:replace="~{admin/fragments/parts :: topbar}"></div>
<div th:replace="~{admin/fragments/parts :: sidebar('businesses')}"></div>

<main class="admin-main">
    <div class="admin-page-header">
        <div>
            <h1>Businesses</h1>
            <p>All listings, including soft-deleted ones (spec §1 — never hard-deleted).</p>
        </div>
        <a th:href="@{/admin/businesses/new}" class="btn btn-primary btn-sm">
            <i class="bi bi-plus-lg"></i> New listing
        </a>
    </div>

    <div th:replace="~{admin/fragments/parts :: alerts}"></div>

    <form th:action="@{/admin/businesses}" method="get" class="admin-toolbar">
        <input type="text" name="query" th:value="${query}" class="form-control form-control-sm" style="max-width:220px;" placeholder="Search by name"/>
        <select name="categoryId" class="form-select form-select-sm" style="max-width:180px;">
            <option value="">All categories</option>
            <option th:each="c : ${categories}" th:value="${c.id}" th:text="${c.name}" th:selected="${c.id == categoryId}"></option>
        </select>
        <select name="cityId" class="form-select form-select-sm" style="max-width:180px;">
            <option value="">All cities</option>
            <option th:each="c : ${cities}" th:value="${c.id}" th:text="${c.name}" th:selected="${c.id == cityId}"></option>
        </select>
        <div class="form-check form-check-inline">
            <input class="form-check-input" type="checkbox" name="includeDeleted" value="true" th:checked="${includeDeleted}" id="includeDeleted"/>
            <label class="form-check-label small" for="includeDeleted">Include deleted</label>
        </div>
        <button type="submit" class="btn btn-sm btn-outline-secondary"><i class="bi bi-search"></i> Filter</button>
    </form>

    <div class="admin-table-wrap">
        <table class="admin-table">
            <thead>
            <tr>
                <th>Name</th>
                <th>Category</th>
                <th>City / Area</th>
                <th>Rating</th>
                <th>Verified</th>
                <th>Status</th>
                <th></th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="b : ${results.content}">
                <td>
                    <a th:href="@{/admin/businesses/{id}(id=${b.id})}" th:text="${b.name}">Business</a>
                </td>
                <td th:text="${b.category.name}">-</td>
                <td th:text="${b.city.name + ' / ' + b.area.name}">-</td>
                <td th:text="${b.averageRating + ' (' + b.reviewCount + ')'}">-</td>
                <td>
                    <i class="bi bi-patch-check-fill text-success" th:if="${b.verified}"></i>
                    <i class="bi bi-dash-circle text-muted" th:unless="${b.verified}"></i>
                </td>
                <td>
                    <span class="badge bg-success" th:if="${b.deletedAt == null}">Active</span>
                    <span class="badge bg-secondary" th:unless="${b.deletedAt == null}">Deleted</span>
                </td>
                <td class="text-end">
                    <a th:href="@{/admin/businesses/{id}(id=${b.id})}" class="btn btn-sm btn-outline-secondary">View</a>
                </td>
            </tr>
            <tr th:if="${results.content.isEmpty()}">
                <td colspan="7" class="admin-table-empty">No listings found.</td>
            </tr>
            </tbody>
        </table>
        <div class="admin-pagination" th:if="${results.totalPages > 0}">
            <span>Page <span th:text="${results.number + 1}">1</span> of <span th:text="${results.totalPages}">1</span> &middot; <span th:text="${results.totalElements}">0</span> total</span>
            <div class="btn-group btn-group-sm">
                <a class="btn btn-outline-secondary" th:classappend="${!results.hasPrevious()} ? 'disabled'"
                   th:href="@{/admin/businesses(query=${query},categoryId=${categoryId},cityId=${cityId},includeDeleted=${includeDeleted},page=${results.number - 1})}">Previous</a>
                <a class="btn btn-outline-secondary" th:classappend="${!results.hasNext()} ? 'disabled'"
                   th:href="@{/admin/businesses(query=${query},categoryId=${categoryId},cityId=${cityId},includeDeleted=${includeDeleted},page=${results.number + 1})}">Next</a>
            </div>
        </div>
    </div>
</main>

<th:block th:replace="~{admin/fragments/parts :: scripts}"></th:block>
</body>
</html>
